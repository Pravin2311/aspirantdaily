<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Select Quiz – AspirantDaily</title>
  <meta name="description" content="Pick a set of 25 practice questions for your chosen subject on AspirantDaily.">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7495143337429327"
     crossorigin="anonymous"></script>
</head>
<body>

<div class="quiz-selector-container">
  <a href="index.html" class="back-btn">← Back</a>
  <div class="page-header" style="padding-top:1rem;">
    <h1 id="title"></h1>
    <p>Pick a set of 25 questions to begin.</p>
  </div>
  <div id="quizList" class="quiz-list"></div>
</div>

<script>
  const context = JSON.parse(localStorage.getItem("practiceContext") || "{}");
  const subject = context.subject;

  if (!subject) {
    location.href = "index.html";
  }

  const title = document.getElementById("title");
  const list = document.getElementById("quizList");

  const labels = {
    "current-affairs": "Current Affairs",
    reasoning: "Reasoning",
    quant: "Quantitative Aptitude",
    computer: "Computer Awareness",
    science: "General Science",
    "static-gk": "Static GK"
  };

  title.innerText = labels[subject] || "Practice";

  // 🔹 CA = single quiz
  if (subject === "current-affairs") {
    startQuiz(0);
  } else {
    // 🔹 4 quizzes (25 × 4 = 100)
    for (let i = 0; i < 2; i++) {
      const btn = document.createElement("button");
      btn.className = "btn primary block";
      btn.innerText = `Quiz ${i + 1} (Questions ${i * 25 + 1}–${i * 25 + 25})`;
      btn.onclick = () => startQuiz(i);
      list.appendChild(btn);
    }
  }

  function startQuiz(quizIndex) {
    localStorage.setItem(
      "practiceContext",
      JSON.stringify({ subject, quizIndex })
    );
    window.location.href = "quiz.html";
  }
</script>

</body>
</html>
