<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Admin Dashboard – AspirantDaily</title>
  <meta name="description" content="Internal admin dashboard for AspirantDaily content management.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=optional" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=2">
</head>

<body>

  <div class="admin-container">
    <h1>Admin Dashboard</h1>
    <p class="admin-hint">
      Internal use only • Admin actions are irreversible
    </p>

    <!-- ===============================
         REGENERATE SUBJECT
         =============================== -->
    <div class="admin-section">
      <h2>Regenerate Subject Pool</h2>

      <select id="subjectSelect">
        <option value="reasoning">Reasoning</option>
        <option value="quant">Quantitative Aptitude</option>
        <option value="computer">Computer Awareness</option>
        <option value="science">General Science</option>
        <option value="static-gk">Static GK</option>
        <option value="current-affairs">Current Affairs</option>
        <option value="english">English (Grammar + Verbal)</option>
        <option value="economics">Economics</option>
        <option value="geography">Geography</option>

      </select>

      <button class="admin-btn primary" onclick="regenerate()">
        Regenerate Subject
      </button>
    </div>

    <!-- ===============================
         MONTHLY CA ARCHIVE
         =============================== -->
    <div class="admin-section">
      <h2>Monthly Current Affairs Archive</h2>

      <button class="admin-btn warning" onclick="archiveCA()">
        Archive Current Month
      </button>
    </div>

    <!-- STATUS -->
    <div id="status" class="admin-status">
      Ready
    </div>

    <div class="admin-hint">
      Tip: Regenerating non-daily subjects should be done rarely
    </div>
  </div>

  <!-- ===============================
       ADMIN LOGIC
       =============================== -->
  <script>
    const API = "https://exam-prep-generator.mydomain2311.workers.dev";
    const TOKEN = prompt("Enter admin token:");

    async function regenerate() {
      const subject = document.getElementById("subjectSelect").value;
      setStatus("Regenerating " + subject + "…");

      try {
        const res = await fetch(
          `${API}/?admin=1&action=regenerate&subject=${subject}&token=${TOKEN}`
        );
        const data = await res.json();

        setStatus(
          data.success
            ? `✅ ${subject} regenerated successfully`
            : `❌ ${JSON.stringify(data)}`
        );
      } catch (e) {
        setStatus("❌ Network error");
      }
    }

    async function archiveCA() {
      setStatus("Archiving current affairs…");

      try {
        const res = await fetch(
          `${API}/?admin=1&action=archive-ca&token=${TOKEN}`
        );
        const data = await res.json();

        setStatus(
          data.success
            ? `📦 Current Affairs archived for ${data.archived}`
            : `❌ ${JSON.stringify(data)}`
        );
      } catch (e) {
        setStatus("❌ Network error");
      }
    }

    function setStatus(msg) {
      document.getElementById("status").innerText = msg;
    }
  </script>

</body>
</html>
